[package]
name = "hotswap"
version = "0.6.4"
description = "Troca de terminais entre worktrees"
authors = ["Gabriel Martins"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a janela transparente no macOS (a opacidade da ajuda)
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Atualizar pelo app: baixa o pacote do release (latest.json), confere a assinatura e instala.
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Já vem com o Tauri (GTK): lê os .desktop e abre o editor como o menu do sistema.
gio = "0.18"

[target.'cfg(windows)'.dependencies]
# Já vem com o Tauri: lista e derruba os processos que rodam no terminal (no Windows não há grupo de processos).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
