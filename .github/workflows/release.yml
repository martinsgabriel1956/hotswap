name: Release

# Toda versão nova que chega na main vira um release com o .deb, o .rpm, o AppImage, o PKGBUILD do AUR, o .exe do Windows e o .dmg do macOS. A versão mora no tauri.conf.json (o "chore: versão X"
# muda ele junto com package.json e Cargo.toml); se a tag v<versão> já existe, o release já foi feito e nada roda.
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
  workflow_dispatch:

permissions:
  contents: write

# Dois pushes seguidos não criam o mesmo release duas vezes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version já tem release; nada a fazer."
          fi

  release:
    needs: check
    if: needs.check.outputs.exists != 'true'
    # 22.04: o .deb linka contra a glibc mais antiga e instala também nas distros mais novas.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O que o Tauri v2 pede no Linux; o appindicator é da bandeja (tray-icon).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # O instalador do Windows, compilado daqui: NSIS, o linker e o rc do LLVM, e o cargo-xwin (que baixa o SDK do Windows).
      # O NSIS do 22.04 (3.08) não traz o RestartManager.nsh, que o instalador do Tauri inclui; a cópia veio do NSIS 3.10.
      - run: |
          sudo apt-get install -y nsis lld llvm
          sudo cp scripts/nsis/RestartManager.nsh /usr/share/nsis/Include/Win/
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin

      - run: npm ci

      # Testes, pacotes, notas e o release: o mesmo script que roda à mão.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh

  # O .dmg só compila num Mac: entra no release que o job de cima criou. Se falhar, "Re-run failed jobs" tenta de novo
  # sem refazer o release. Universal: um arquivo só para Apple Silicon e Intel.
  macos:
    needs: [check, release]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "src-tauri/target/universal-apple-darwin/release/bundle/dmg/hotswap_${VERSION}_universal.dmg"
